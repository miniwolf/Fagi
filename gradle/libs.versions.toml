[versions]
junit = "6.1.0-M1"
mockito = "5.21.0"
testfx = "4.0.18"

[libraries]
# --------- Prod dependenices ---------
gson = { module = "com.google.code.gson:gson", version = "2.13.2" }
# -------------------------------------

# --------- Test dependenices ---------
hamcrest = { module = "org.hamcrest:hamcrest", version = "3.0" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform = { module = "org.junit.platform:junit-platform-suite", version.ref = "junit" }

mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

openjfx-javafx-swing = { module = "org.openjfx:javafx-swing", version = "25.0.3" }

testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
testfx-openjfx-monocle = { module = "org.testfx:openjfx-monocle", version = "21.0.2" }
# -------------------------------------

[bundles]
junit-base = ["junit-jupiter-api", "junit-jupiter-engine"]
mockito = ["mockito-core", "mockito-junit-jupiter"]
testfx = ["openjfx-javafx-swing", "testfx-core", "testfx-junit5", "testfx-openjfx-monocle"]

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
pitest = { id = "info.solidsoft.pitest", version = "1.19.0" }